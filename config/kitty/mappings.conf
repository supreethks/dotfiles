# Common shortcuts (similar to many terminals)
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+n     new_window
map cmd+t            new_tab
map cmd+w            close_window

# Splits
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+backspace launch --location=vsplit
map cmd+d            launch --location=hsplit
map cmd+shift+d      launch --location=vsplit

# Navigate tabs/windows
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map cmd+shift+]      next_tab
map cmd+shift+[      previous_tab
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# Resize active split
map ctrl+shift+alt+right resize_window wider 3
map ctrl+shift+alt+left  resize_window narrower 3
map ctrl+shift+alt+up    resize_window taller 2
map ctrl+shift+alt+down  resize_window shorter 2

# Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard

# URL and file hints
map ctrl+shift+o kitten hints --type url
map ctrl+shift+p kitten hints --type path
map cmd+o        kitten hints --type url

# Search scrollback
map ctrl+shift+f kitten hyperlinked_grep

# Utils
map cmd+,        edit_config_file
map cmd+r        reload_config
map ctrl+shift+? show_key
map ctrl+shift+f5 choose_font
