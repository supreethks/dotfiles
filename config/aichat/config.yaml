# AIChat talks to the local cursor-agent proxy, not a public API key.
# The proxy is started on first use from zsh (Cmd+E or `??`).
model: cursor-agent:default
stream: false
save: true
keybindings: emacs
save_shell_history: true

clients:
  - type: openai-compatible
    name: cursor-agent
    api_base: http://127.0.0.1:18741/v1
    api_key: local
    models:
      - name: default
        max_input_tokens: 128000
