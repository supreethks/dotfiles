# Local-only history. Enable sync later with `atuin login` if you want it.
auto_sync = false
update_check = false
style = "compact"
inline_height = 24
enter_accept = false
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
search_mode = "fuzzy"
search_mode_shell_up_key_binding = "prefix"
show_preview = true
show_help = false
exit_mode = "return-original"
