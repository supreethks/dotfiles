[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
pane_borders = true
pane_outer_borders = true
show_agent_labels_on_pane_borders = true
copy_on_select = true
confirm_close = false
sidebar_start_collapsed = true

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "reset"

[keys]
prefix = "ctrl+space"

# Direct Cmd bindings (Ghostty passes these through to Herdr).
focus_pane_left = "cmd+h"
focus_pane_down = "cmd+j"
focus_pane_up = "cmd+k"
focus_pane_right = "cmd+l"

split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"

resize_pane_left = "cmd+alt+h"
resize_pane_down = "cmd+alt+j"
resize_pane_up = "cmd+alt+k"
resize_pane_right = "cmd+alt+l"

zoom = "cmd+shift+enter"

new_tab = "cmd+t"
close_pane = "cmd+w"
previous_tab = "cmd+["
next_tab = "cmd+]"
switch_tab = ["prefix+1..9", "cmd+1..9"]

previous_workspace = "cmd+alt+u"
next_workspace = "cmd+alt+d"

reload_config = "cmd+shift+r"


[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

