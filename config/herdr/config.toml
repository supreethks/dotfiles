[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
pane_borders = true
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

[theme]
name = "tokyo-night"

[theme.custom]
panel_bg = "reset"

[keys]
prefix = "ctrl+space"
switch_tab = "prefix+1..9"
focus_pane_left = ""
focus_pane_right = ""
previous_tab = "prefix+h"
next_tab = "prefix+l"
previous_workspace = "prefix+u"
next_workspace = "prefix+d"

[ui.sidebar.agents]
rows = [["state_text", "workspace", "tab"], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_context", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_week_inline_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_inline_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_inline_danger", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]]
row_gap = 0 # herdr-agent-quota

[ui.sidebar.agents.rows_by_agent]
claude = [["state_text", "workspace", "tab"], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_context", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_week_inline_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_inline_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_inline_danger", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]] # herdr-agent-quota-provider
