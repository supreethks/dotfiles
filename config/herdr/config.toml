[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
pane_borders = true
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"

[keys]
prefix = "ctrl+space"

# Bound on prefix+...; Ghostty forwards Cmd chords as Ctrl+Space sequences.
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

zoom = "prefix+z"

new_tab = "prefix+c"
close_pane = "prefix+x"
previous_tab = "prefix+h"
next_tab = "prefix+l"
switch_tab = "prefix+1..9"

previous_workspace = "prefix+u"
next_workspace = "prefix+d"


[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

# >>> herdr-ai-tracker sidebar
